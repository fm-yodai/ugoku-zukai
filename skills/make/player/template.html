<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--UZ:HEAD-->
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
__FONT_LINK__
<style>
  :root { --page: #f4f5f7; --ink: #1d2433; --muted: #5d6676; --line: #d3d8e0; --accent: #1a5fd0; --err: #b3261e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #121418; --ink: #e9eaec; --muted: #9aa1ab; --line: #2c3139; --accent: #7fb0ff; --err: #ff8a80; color-scheme: dark; } }
  :root[data-theme="dark"] { --page: #121418; --ink: #e9eaec; --muted: #9aa1ab; --line: #2c3139; --accent: #7fb0ff; --err: #ff8a80; color-scheme: dark; }
  body { background: var(--page); color: var(--ink); font: 14px/1.6 "Noto Sans JP", system-ui, sans-serif;
         padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .uz-wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 10px; }
  .uz-stage { width: 100%; height: auto; display: block; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 8px; box-shadow: 0 1px 0 var(--line); }
  .uz-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .uz-bar button { font: inherit; font-weight: 700; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; cursor: pointer; min-width: 96px; }
  .uz-bar button:hover, .uz-bar button:focus-visible { border-color: var(--accent); outline: none; }
  .uz-bar input[type=range] { accent-color: var(--accent); }
  .uz-bar output { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; text-align: right; }
  .uz-bar label { color: var(--muted); display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .uz-note { color: var(--muted); font-size: 12px; }
  /* 直したい箇所を指す（ふだんは畳んでおく。視聴者には要らない表示のため） */
  .uz-point { color: var(--muted); font-size: 12px; }
  .uz-point summary { cursor: pointer; width: fit-content; border-radius: 4px; }
  .uz-point summary:hover, .uz-point summary:focus-visible { color: var(--accent); outline: none; }
  .uz-point-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
  #uz-pos { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--ink); padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px;
            user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; min-width: 0; }
  .uz-point button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
  .uz-point button:hover, .uz-point button:focus-visible, .uz-point button[aria-pressed="true"] { border-color: var(--accent); outline: none; }
  .uz-point button[aria-pressed="true"] { color: var(--accent); }
  .uz-point p { margin: 0; }
  /* 再生バーの刻み（チャプターの始まり）。つまみの半径ぶん内側に寄せる */
  .uz-seek { position: relative; flex: 1; min-width: 160px; display: flex; align-items: center; }
  .uz-seek input[type=range] { flex: 1; min-width: 0; margin: 0; }
  #uz-ticks { position: absolute; left: 8px; right: 8px; top: 0; bottom: 0; pointer-events: none; }
  #uz-ticks span { position: absolute; top: 50%; width: 2px; height: 12px; margin-left: -1px; transform: translateY(-50%); background: var(--muted); opacity: .6; border-radius: 1px; }
  /* チャプター一覧。広い画面では図の右、狭い画面では再生バーの下 */
  #uz-chapters { border-top: 1px solid var(--line); padding-top: 6px; max-height: 60vh; overflow-y: auto; overscroll-behavior: contain; }
  #uz-chapters h2 { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 4px; letter-spacing: .05em; }
  #uz-chapters ol { list-style: none; margin: 0; padding: 0; }
  #uz-chapters > ol > li { margin: 0 0 6px; }
  #uz-chapters ol ol { padding-left: 10px; border-left: 2px solid var(--line); margin-left: 6px; }
  #uz-chapters button { font: inherit; color: var(--ink); background: none; border: 0; border-radius: 4px; text-align: left; cursor: pointer; }
  #uz-chapters button:hover, #uz-chapters button:focus-visible { color: var(--accent); outline: none; }
  #uz-chapters button:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  #uz-chapters time { font-variant-numeric: tabular-nums; color: var(--muted); margin-right: 8px; font-size: 12px; }
  #uz-chapters .uz-chapter { display: block; width: 100%; padding: 4px 6px; font-weight: 700; overflow-wrap: anywhere; }
  .uz-row { display: flex; align-items: flex-start; gap: 2px; }
  #uz-chapters .uz-line { flex: 1; min-width: 0; padding: 2px 6px; font-size: 13px; overflow-wrap: anywhere; }
  #uz-chapters .uz-src-btn { flex: none; padding: 2px 6px; color: var(--muted); font-size: 12px; }
  #uz-chapters .uz-src-btn:hover, #uz-chapters .uz-src-btn:focus-visible, #uz-chapters .uz-src-btn[aria-expanded="true"] { color: var(--accent); }
  #uz-chapters button[aria-current="true"] { color: var(--accent); }
  #uz-chapters .uz-line[aria-current="true"] { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .uz-line[aria-current="true"] time { color: var(--accent); }
  .uz-tip { position: fixed; z-index: 10; max-width: min(320px, calc(100vw - 32px)); padding: 6px 10px; font-size: 12px; line-height: 1.5;
            color: var(--ink); background: var(--page); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 12px rgba(0, 0, 0, .18); overflow-wrap: anywhere; }
  .uz-tip div { white-space: pre-wrap; }
  /* 2 列にするのは一覧が出ているときだけ（:has を知らないブラウザでは 1 列のまま、一覧は下に出る） */
  @media (min-width: 960px) {
    .uz-wrap:has(> #uz-chapters:not([hidden])) { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
    .uz-wrap:has(> #uz-chapters:not([hidden])) > * { grid-column: 1; }
    /* 一覧の高さは図・再生バー・注記・「直したい箇所を指す」の列に合わせる（contain: size で行の高さを押し広げない） */
    .uz-wrap:has(> #uz-chapters:not([hidden])) > #uz-chapters { grid-column: 2; grid-row: 1 / span 4; align-self: stretch; contain: size; max-height: none; border-top: 0; border-left: 1px solid var(--line); padding: 0 0 0 10px; }
  }
  .uz-err { color: var(--err); white-space: pre-wrap; }
</style>
<!--UZ:HEAD_END-->
</head>
<body>
<!--UZ:BODY-->
<div class="uz-wrap" id="uz-player">
  <svg class="uz-stage" id="uz-stage" role="img" aria-label="__TITLE__"></svg>
  <div class="uz-bar">
    <button id="uz-play" type="button">▶ 再生</button>
    <div class="uz-seek"><input id="uz-seek" type="range" min="0" max="1000" value="0" aria-label="再生位置"><div id="uz-ticks" aria-hidden="true"></div></div>
    <output id="uz-clock">0:00 / 0:00</output>
    <label><input id="uz-subs" type="checkbox" checked> 字幕</label>
  </div>
  <div class="uz-note" id="uz-note"></div>
  <details class="uz-point" id="uz-point">
    <summary>直したい箇所を指す</summary>
    <div class="uz-point-row"><output id="uz-pos"></output>
      <button id="uz-pos-copy" type="button">コピー</button>
      <button id="uz-pos-from" type="button" aria-pressed="false">ここを範囲の始まりにする</button></div>
    <p class="uz-note" id="uz-pos-note">止めた位置の、場面と行の番号と時刻です。コピーして Claude に伝えると、その箇所を直せます。2 か所で挟むときは、始まりで「ここを範囲の始まりにする」を押し、終わりまで進めてからコピーします。</p>
  </details>
  <nav id="uz-chapters" aria-label="チャプター" hidden><h2>チャプター</h2><ol></ol></nav>
  <div class="uz-err" id="uz-err" hidden></div>
</div>
<script>/*UZ:ELK*/</script>
<script>/*UZ:CORE*/</script>
<script>
const UZ_DATA = /*UZ:DATA*/null;
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const showErr = m => { const e = $("uz-err"); e.textContent = m; e.hidden = false; };
  UZ.ELK = window.ELK;
  let M, view, ctx = null, buffer = null, src = null, t0 = 0, pausedAt = 0, playing = false, wallT0 = 0;
  const hasAudio = !!UZ_DATA.audio;
  // 時計: 音声があれば WebAudio の時計、なければ performance.now()（チャットのプレビューでは audio 要素が使えないため）
  const now = () => !playing ? pausedAt : hasAudio ? ctx.currentTime - t0 : (performance.now() - wallT0) / 1000;
  async function ensureAudio() {
    if (!hasAudio || ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const bin = atob(UZ_DATA.audio), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    buffer = await ctx.decodeAudioData(buf.buffer);
  }
  function startAt(off) {
    if (hasAudio) {
      if (src) { src.onended = null; try { src.stop(); } catch (e) {} }
      src = ctx.createBufferSource(); src.buffer = buffer; src.connect(ctx.destination);
      if (off < buffer.duration) src.start(0, off);
      t0 = ctx.currentTime - off;
    } else wallT0 = performance.now() - off * 1000;
    playing = true; $("uz-play").textContent = "❚❚ 一時停止";
    requestAnimationFrame(tick);
  }
  function pause() {
    pausedAt = now(); playing = false;
    if (src) { src.onended = null; try { src.stop(); } catch (e) {} }
    $("uz-play").textContent = "▶ 再生";
  }
  function tick() {
    if (!M || !view) return;
    const D = M.duration, t = Math.min(now(), D);
    if (playing && now() >= D) { pause(); pausedAt = D; $("uz-play").textContent = "▶ もう一度"; }
    view.render(t);
    $("uz-seek").value = Math.round(t / D * 1000);
    $("uz-clock").textContent = `${fmt(t)} / ${fmt(D)}`;
    markCurrent(t);
    showPos(t);
    if (playing) requestAnimationFrame(tick);
  }
  $("uz-play").onclick = async () => {
    try {
      await ensureAudio();
      if (ctx && ctx.state === "suspended") await ctx.resume();
      if (playing) pause(); else startAt(pausedAt >= M.duration - 0.05 ? 0 : pausedAt);
    } catch (e) { showErr("音声を再生できませんでした: " + e.message); }
  };
  function seekTo(t) { if (playing) startAt(t); else { pausedAt = t; $("uz-play").textContent = "▶ 再生"; tick(); } }
  $("uz-seek").oninput = () => seekTo($("uz-seek").value / 1000 * M.duration);
  $("uz-subs").onchange = () => { view.subtitles = $("uz-subs").checked; view._sub = null; tick(); };
  document.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); $("uz-play").click(); } });
  UZ.player = { seek: seekTo, get model() { return M; } };
  // チャプター一覧。題は場面の title か図の title（engine の header）。題の無い場面は直前のチャプターに入れる
  function chapterData() {
    const start = {};
    for (const l of M.timeline.lines) start[l.id] = l.start;
    const out = [];
    for (const sc of M.scenes) {
      let title = sc.header || "";
      if (!title && sc.figs.length === 1 && M.figs[sc.figs[0]] && M.figs[sc.figs[0]].type === "title") title = "はじめに";
      let ch = out[out.length - 1];
      if (!ch || (title && title !== ch.title)) { ch = { title: title || "はじめに", start: sc.start, lines: [] }; out.push(ch); }
      for (const ln of sc.lines || []) {
        const t = UZ.parseText(ln.text).text, cs = Array.from(t);
        const sources = (typeof ln.source === "string" ? [ln.source] : Array.isArray(ln.source) ? ln.source : []).filter(x => typeof x === "string" && x);
        ch.lines.push({ id: ln.id, start: ln.id in start ? start[ln.id] : sc.start, text: cs.length > 24 ? cs.slice(0, 24).join("") + "…" : t, sources });
      }
    }
    return out;
  }
  let marks = null, curCh = -1, curLn = -1;
  // 今の時刻に当たるチャプターと行に aria-current を付ける（一覧が無ければ何もしない）
  function markCurrent(t) {
    if (!marks) return;
    // 最初の行より前（0:00 の直後）は最初のチャプターと行を今とみなす
    const find = arr => { let k = arr.length ? 0 : -1; for (let i = 0; i < arr.length; i++) if (arr[i].start <= t + 0.01) k = i; return k; };
    const c = find(marks.chapters), l = find(marks.lines);
    if (c !== curCh) { if (curCh >= 0) marks.chapters[curCh].el.removeAttribute("aria-current"); if (c >= 0) marks.chapters[c].el.setAttribute("aria-current", "true"); curCh = c; }
    if (l !== curLn) {
      if (curLn >= 0) marks.lines[curLn].el.removeAttribute("aria-current");
      if (l >= 0) {
        const el = marks.lines[l].el, nav = $("uz-chapters");
        el.setAttribute("aria-current", "true");
        // 再生中は今の行が一覧の中で見えるように（ページはスクロールしない）。
        // 根拠の吹き出しが出ている間は動かさない（一覧のスクロールで吹き出しが閉じるため）
        const tip = $("uz-tip");
        if (playing && (!tip || tip.hidden) && nav.scrollHeight > nav.clientHeight) {
          const top = el.offsetTop - nav.offsetTop, bottom = top + el.offsetHeight;
          if (top < nav.scrollTop || bottom > nav.scrollTop + nav.clientHeight) nav.scrollTop = Math.max(0, top - nav.clientHeight / 3);
        }
      }
      curLn = l;
    }
  }
  // 一覧の描画。データは textContent だけで入れる
  function buildChapters() {
    const chapters = chapterData(), nav = $("uz-chapters"), root = nav.querySelector("ol");
    const btn = (cls, start, text) => {
      const b = document.createElement("button"), tm = document.createElement("time");
      b.type = "button"; b.className = cls; tm.textContent = fmt(start);
      b.append(tm, text); b.onclick = () => UZ.player.seek(start);
      return b;
    };
    // 根拠の吹き出しは 1 つだけ。行に重ねると下に出し、※ を押すと開いたままにする
    const tip = document.createElement("div");
    tip.className = "uz-tip"; tip.id = "uz-tip"; tip.setAttribute("role", "tooltip"); tip.hidden = true;
    document.body.append(tip);
    let pinned = null;
    // マウスを乗せて出すのはポインタで重ねられる端末だけ。タッチでは ※ を押して出す。
    // フォーカスで出すのはキーボードで移ったとき（:focus-visible）だけ（タップでのフォーカスでは出さない）
    const canHover = !!(window.matchMedia && window.matchMedia("(hover: hover)").matches);
    const byKeyboard = el => { try { return el.matches(":focus-visible"); } catch (e) { return true; } };
    // 吹き出しは 1 つを使い回すので、aria-describedby は今出している行にだけ付ける
    let described = null;
    const describe = el => { if (described) described.removeAttribute("aria-describedby"); described = el; if (el) el.setAttribute("aria-describedby", "uz-tip"); };
    const conceal = () => { tip.hidden = true; describe(null); };
    const show = (row, sources, lb) => {
      describe(lb);
      tip.replaceChildren(...sources.map(s => { const d = document.createElement("div"); d.textContent = s; return d; }));
      tip.hidden = false;
      const r = row.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
      const left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
      const top = r.bottom + 4 + h > window.innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4;
      tip.style.left = left + "px"; tip.style.top = top + "px";
    };
    const hide = () => { conceal(); if (pinned) { pinned.setAttribute("aria-expanded", "false"); pinned = null; } };
    const lines = [], chs = [];
    for (const ch of chapters) {
      const li = document.createElement("li"), cb = btn("uz-chapter", ch.start, ch.title), ol = document.createElement("ol");
      chs.push({ start: ch.start, el: cb });
      ch.lines.forEach((ln, i) => {
        const lli = document.createElement("li"), row = document.createElement("div"), lb = btn("uz-line", ln.start, ln.text);
        row.className = "uz-row"; row.append(lb);
        // チャプターの頭の行は、チャプターの始まり（行の少し前）から今とみなす
        lines.push({ start: i === 0 ? Math.min(ch.start, ln.start) : ln.start, el: lb });
        if (ln.sources.length) {
          const sb = document.createElement("button");
          sb.type = "button"; sb.className = "uz-src-btn"; sb.textContent = "※";
          sb.setAttribute("aria-label", "根拠"); sb.setAttribute("aria-expanded", "false"); sb.setAttribute("aria-controls", "uz-tip");
          const enter = () => { if (!pinned) show(row, ln.sources, lb); };
          const leave = () => { if (!pinned) conceal(); };
          if (canHover) { lb.addEventListener("mouseenter", enter); lb.addEventListener("mouseleave", leave); }
          lb.addEventListener("focus", () => { if (byKeyboard(lb)) enter(); });
          lb.addEventListener("blur", () => { if (!canHover || !lb.matches(":hover")) leave(); });
          sb.addEventListener("click", e => {
            e.stopPropagation();
            if (pinned === sb) { hide(); return; }
            hide(); pinned = sb; sb.setAttribute("aria-expanded", "true"); show(row, ln.sources, lb);
          });
          row.append(sb);
        }
        lli.append(row); ol.append(lli);
      });
      li.append(cb, ol); root.append(li);
    }
    document.addEventListener("click", e => { if (pinned && !tip.contains(e.target)) hide(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !tip.hidden) hide(); });
    nav.addEventListener("scroll", () => { if (!tip.hidden) hide(); }, { passive: true });
    window.addEventListener("resize", () => { if (!tip.hidden) hide(); });
    // 再生バーの刻み（最初のチャプターは 0:00 なので置かない）
    const ticks = $("uz-ticks");
    for (const ch of chapters.slice(1)) {
      const sp = document.createElement("span");
      sp.style.left = (ch.start / M.duration * 100) + "%";
      ticks.append(sp);
    }
    nav.hidden = false;
    marks = { chapters: chs, lines };
    markCurrent(pausedAt);
  }
  // 直したい箇所を指す。今の位置を「場面 / 行 @時刻」で出す（絵コンテのページの行の表記と同じ）。
  // 場面は始まっている最後の場面。行は、その場面で始まっている最後の行（まだ 1 行も始まっていなければ場面の最初の行）
  function posAt(t) {
    let sc = M.scenes[0];
    for (const s of M.scenes) if (s.start <= t + 0.01) sc = s;
    const ids = new Set((sc.lines || []).map(l => l.id));
    const own = M.timeline.lines.filter(l => ids.has(l.id));
    let ln = own[0];
    for (const l of own) if (l.start <= t + 0.01) ln = l;
    return { scene: sc.id, line: ln ? ln.id : "", t };
  }
  // 1 点は「s2 / l2 @0:14」。2 点は時刻の早い順に「〜」でつなぐ（同じ表記になる 2 点は 1 点として出す）
  function posText(a, b) {
    const one = p => `${p.scene} / ${p.line} @${fmt(p.t)}`;
    if (!b || one(a) === one(b)) return one(a);
    return a.t <= b.t ? `${one(a)} 〜 ${one(b)}` : `${one(b)} 〜 ${one(a)}`;
  }
  let posFrom = null, pointOk = false;
  function showPos(t) {
    if (!pointOk) return;
    const s = posText(posAt(t), posFrom), el = $("uz-pos");
    if (el.textContent !== s) el.textContent = s;
  }
  function buildPoint() {
    const note = $("uz-pos-note"), help = note.textContent, from = $("uz-pos-from");
    const cur = () => Math.min(now(), M.duration);
    let timer = 0;
    // 成功の知らせは 2 秒で元の説明に戻す。失敗の知らせは、次に押すまで残す
    const say = (m, keep) => { clearTimeout(timer); note.textContent = m; if (!keep) timer = setTimeout(() => { note.textContent = help; }, 2000); };
    const select = () => { const r = document.createRange(), s = window.getSelection(); r.selectNodeContents($("uz-pos")); s.removeAllRanges(); s.addRange(r); };
    from.onclick = () => {
      posFrom = posFrom ? null : posAt(cur());
      from.textContent = posFrom ? "範囲をやめる" : "ここを範囲の始まりにする";
      from.setAttribute("aria-pressed", posFrom ? "true" : "false");
      clearTimeout(timer); note.textContent = help;
      showPos(cur());
    };
    // コピーは 3 段: クリップボードの API → 文字を選択して execCommand → 選択だけ残して手でコピーしてもらう
    // （Artifact は iframe の中で動くので、クリップボードが拒否されることがある）
    $("uz-pos-copy").onclick = async () => {
      const text = $("uz-pos").textContent;
      try { await navigator.clipboard.writeText(text); say("コピーしました"); return; } catch (e) {}
      select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      if (ok) { say("コピーしました"); return; }
      // 再生中は位置の文字が書き換わって選択が消えるので、止めてから選択し直す
      if (playing) { pause(); tick(); }
      select();
      say("コピーできませんでした。選択された文字をコピーしてください", true);
    };
    pointOk = true;
    showPos(pausedAt);
  }
  (async () => {
    try {
      if (document.fonts && document.fonts.load) await Promise.race([document.fonts.load(`500 24px ${UZ_DATA.theme.font.family}`), new Promise(r => setTimeout(r, 2500))]);
      M = await UZ.build(UZ_DATA.storyboard, UZ_DATA.theme, UZ_DATA.timeline);
      if (M.errors.length) { showErr("台本に誤りがあります:\n" + M.errors.join("\n")); return; }
      view = new UZ.View($("uz-stage"), M);
      if (!hasAudio) $("uz-note").textContent = "音声なし（時刻は文字数からの見積もり）";
      // 止まっている間は、最初の図が出そろったコマを見せる
      const firstFull = M.scenes.length > 1 ? M.scenes[1].start + 0.01 : M.duration / 2;
      pausedAt = M.scenes[0].figs.some(f => !M.figs[f].autoShow) ? (M.timeline.lines[0].start + M.timeline.lines[0].dur) : Math.min(firstFull - 0.4, 3);
      tick(); pausedAt = 0; $("uz-seek").value = 0; $("uz-clock").textContent = `0:00 / ${fmt(M.duration)}`;
      // 一覧が壊れても再生は止めない（一覧は出さずにコンソールへ）
      try { buildChapters(); } catch (e) { console.error("チャプター一覧を作れなかった:", e); marks = null; $("uz-chapters").hidden = true; $("uz-ticks").replaceChildren(); }
      // 位置の表示が壊れても再生は止めない
      try { buildPoint(); } catch (e) { console.error("位置の表示を用意できなかった:", e); pointOk = false; $("uz-point").hidden = true; }
      document.dispatchEvent(new CustomEvent("uz-ready"));
    } catch (e) { showErr("準備に失敗しました: " + e.message); console.error(e); }
  })();
})();
</script>
