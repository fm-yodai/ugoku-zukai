<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>再生ページ検証</title>
<style>
  :root { --bg:#fbfbfa; --fg:#1d1d1b; --muted:#6b6b66; --line:#deded8; --ok:#1f7a3a; --ng:#b3261e; --pend:#8a6d00; --accent:#2f5bd3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#181816; --fg:#ececea; --muted:#a3a39c; --line:#3a3a36; --ok:#5cc27a; --ng:#ff8a80; --pend:#e0c050; --accent:#8fb0ff; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.6 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 16px; }
  table { width:100%; border-collapse: collapse; margin: 12px 0; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align: top; }
  td.r { white-space: nowrap; font-weight: 600; }
  .ok { color: var(--ok); } .ng { color: var(--ng); } .pend { color: var(--pend); }
  button { font: inherit; padding: 6px 12px; margin: 4px 6px 4px 0; border:1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  textarea { width:100%; height: 180px; font: 12px/1.4 ui-monospace, monospace; background: transparent; color: var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; }
  svg { width: 100%; height: auto; border:1px solid var(--line); border-radius: 6px; }
  .note { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>再生ページ検証 — 経路: __ROUTE__</h1>
  <p class="lead">埋め込み音声: __AUDIO_LABEL__ ／ 詰め物 __PAD_MB__MB。ボタンを上から順に押し、最後に「結果をコピー」の内容をチャットに貼ってください。</p>

  <svg id="stage" viewBox="0 0 640 160" role="img" aria-label="アニメーションの試験">
    <rect id="box" x="20" y="50" width="160" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
    <text id="label" x="100" y="86" text-anchor="middle" font-size="18" fill="currentColor">申請を受け付ける</text>
  </svg>

  <div>
    <button id="b-webaudio">1. 埋め込み音声を WebAudio で再生（本命）</button>
    <button id="b-audio">2. audio 要素（data URI）で再生</button>
    <button id="b-blob">3. Blob URL で再生</button>
    <button id="b-speech">4. ブラウザの読み上げ</button>
    <button id="b-dl-blob">5. ダウンロード（blob）</button>
    <button id="b-dl-data">6. ダウンロード（data URI）</button>
    <button id="b-anim">7. 図を動かす</button>
  </div>
  <audio id="player" controls preload="auto" src="data:audio/wav;base64,__AUDIO_B64__" style="width:100%;margin-top:8px"></audio>
  <p class="note">再生ボタン（上の audio 部品）から直接鳴らせるかも、聞こえたかどうかで表に反映してください（3 つのボタン「聞こえた / 聞こえない」）。</p>
  <div>
    <button data-heard="yes">音が聞こえた</button>
    <button data-heard="no">音が聞こえない</button>
    <button data-heard="speech-yes">読み上げが聞こえた</button>
    <button data-heard="speech-no">読み上げが聞こえない</button>
    <button data-heard="dl-yes">ファイルが保存された</button>
    <button data-heard="dl-no">ファイルが保存されない</button>
  </div>

  <table><thead><tr><th>項目</th><th>結果</th><th>詳細</th></tr></thead><tbody id="rows"></tbody></table>

  <button id="b-copy">結果をコピー</button>
  <textarea id="out" readonly></textarea>
</main>
<script>
// 音声が埋め込まれていない軽い版では、ページの中で試験音（WAV）を作って data URI にする
(function () {
  const p = document.getElementById('player');
  if (p.getAttribute('src').length > 30) return;
  const rate = 24000, n = rate * 2, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 440 * i / rate) * 8000 * Math.min(1, (n - i) / 2000), true);
  let s = ''; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b));
  p.src = 'data:audio/wav;base64,' + btoa(s);
})();
const B64 = document.getElementById('player').src.split(',')[1];
const results = {};
function set(key, state, detail) {
  results[key] = { state, detail: String(detail ?? '') };
  render();
}
function render() {
  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  for (const [k, v] of Object.entries(results)) {
    const tr = document.createElement('tr');
    const cls = v.state === 'OK' ? 'ok' : v.state === 'NG' ? 'ng' : 'pend';
    tr.innerHTML = `<td>${k}</td><td class="r ${cls}">${v.state}</td><td>${v.detail.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</td>`;
    rows.appendChild(tr);
  }
  document.getElementById('out').value = '## 再生ページ検証の結果\n' +
    Object.entries(results).map(([k, v]) => `- ${k}: ${v.state} ${v.detail}`).join('\n');
}
function guard(key, fn) { try { const r = fn(); if (r && r.catch) r.catch(e => set(key, 'NG', e.name + ': ' + e.message)); } catch (e) { set(key, 'NG', e.name + ': ' + e.message); } }
function bytes() { const s = atob(B64); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }

// 0. 環境（自動）
set('経路', 'INFO', '__ROUTE__');
set('環境', 'INFO', `${navigator.userAgent} / secure=${isSecureContext} / iframe=${window.top !== window} / origin=${location.origin} / ページ ${(document.documentElement.outerHTML.length / 1e6).toFixed(2)}MB`);
// 自動判定できる機能
set('WebCodecs VideoEncoder', typeof VideoEncoder === 'function' ? 'OK' : 'NG', typeof VideoEncoder);
set('WebCodecs AudioEncoder', typeof AudioEncoder === 'function' ? 'OK' : 'NG', typeof AudioEncoder);
if (typeof VideoEncoder === 'function') {
  VideoEncoder.isConfigSupported({ codec: 'avc1.42001f', width: 1280, height: 720, bitrate: 2e6, framerate: 30 })
    .then(r => set('H.264 エンコード（mp4 書き出しの前提）', r.supported ? 'OK' : 'NG', 'avc1.42001f 1280x720'))
    .catch(e => set('H.264 エンコード（mp4 書き出しの前提）', 'NG', e.message));
}
if (typeof AudioEncoder === 'function') {
  AudioEncoder.isConfigSupported({ codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 1, bitrate: 96000 })
    .then(r => set('AAC エンコード', r.supported ? 'OK' : 'NG', 'mp4a.40.2'))
    .catch(e => set('AAC エンコード', 'NG', e.message));
  AudioEncoder.isConfigSupported({ codec: 'opus', sampleRate: 48000, numberOfChannels: 1, bitrate: 64000 })
    .then(r => set('Opus エンコード（AAC の代わり）', r.supported ? 'OK' : 'NG', 'opus'))
    .catch(e => set('Opus エンコード（AAC の代わり）', 'NG', e.message));
}
set('MediaRecorder', typeof MediaRecorder === 'function' ? 'OK' : 'NG',
  typeof MediaRecorder === 'function' ? `mp4=${MediaRecorder.isTypeSupported('video/mp4')} webm=${MediaRecorder.isTypeSupported('video/webm')}` : '');
set('canvas.captureStream', typeof HTMLCanvasElement.prototype.captureStream === 'function' ? 'OK' : 'NG', '');
set('Web Animations API', typeof Element.prototype.animate === 'function' ? 'OK' : 'NG', '');
const player = document.getElementById('player');
player.addEventListener('canplaythrough', () => set('audio 要素の読み込み（data URI）', 'OK', `長さ ${player.duration.toFixed(1)} 秒`), { once: true });
player.addEventListener('error', () => set('audio 要素の読み込み（data URI）', 'NG', player.error && player.error.message), { once: true });
function voices() {
  if (!('speechSynthesis' in window)) { set('読み上げの音声一覧', 'NG', 'speechSynthesis が無い'); return; }
  const ja = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('ja'));
  set('読み上げの音声一覧', ja.length ? 'OK' : 'PENDING', ja.map(v => v.name + (v.localService ? '' : '(online)')).join(', ') || 'まだ取得できていない');
}
voices();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = voices;

// ボタン
document.getElementById('b-audio').onclick = () => guard('2 data URI の再生', () => { player.currentTime = 0; return player.play().then(() => set('2 data URI の再生', 'OK', 'play() 成功（聞こえたかは下のボタンで）')); });
document.getElementById('b-blob').onclick = () => guard('3 Blob URL の再生', () => {
  const url = URL.createObjectURL(new Blob([bytes()], { type: 'audio/wav' }));
  const a = new Audio(url);
  return a.play().then(() => set('3 Blob URL の再生', 'OK', 'play() 成功'));
});
document.getElementById('b-webaudio').onclick = () => guard('1 WebAudio', async () => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ctx.decodeAudioData(bytes().buffer);
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination); src.start();
  set('1 WebAudio', 'OK', `decode 成功 ${buf.duration.toFixed(1)} 秒 / state=${ctx.state}`);
});
document.getElementById('b-speech').onclick = () => guard('4 ブラウザの読み上げ', () => {
  if (!('speechSynthesis' in window)) { set('4 ブラウザの読み上げ', 'NG', 'speechSynthesis が無い'); return; }
  const u = new SpeechSynthesisUtterance('このページでは、申請が届いてから承認されるまでの流れを、順番に見ていきます。');
  u.lang = 'ja-JP';
  const ja = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('ja'));
  const best = ja.find(v => /Natural|Online|Google/.test(v.name)) || ja[0];
  if (best) u.voice = best;
  u.onstart = () => set('4 ブラウザの読み上げ', 'OK', `開始（${best ? best.name : '既定の声'}）`);
  u.onerror = e => set('4 ブラウザの読み上げ', 'NG', e.error);
  speechSynthesis.speak(u);
  setTimeout(() => { if (!results['4 ブラウザの読み上げ']) set('4 ブラウザの読み上げ', 'NG', '2 秒たっても開始しない'); }, 2000);
});
function dl(href, name, key) {
  const a = document.createElement('a'); a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  set(key, 'PENDING', 'クリックした。保存されたかを下のボタンで');
}
document.getElementById('b-dl-blob').onclick = () => guard('5 ダウンロード（blob）', () => dl(URL.createObjectURL(new Blob(['evx probe'], { type: 'text/plain' })), 'evx_probe_blob.txt', '5 ダウンロード（blob）'));
document.getElementById('b-dl-data').onclick = () => guard('6 ダウンロード（data URI）', () => dl('data:text/plain;base64,' + btoa('evx probe'), 'evx_probe_data.txt', '6 ダウンロード（data URI）'));
document.getElementById('b-anim').onclick = () => guard('7 図のアニメーション', () => {
  const box = document.getElementById('box'), label = document.getElementById('label');
  const k = [{ transform: 'translateX(0)' }, { transform: 'translateX(420px)' }];
  box.animate(k, { duration: 1500, fill: 'forwards', easing: 'ease-in-out' });
  label.animate(k, { duration: 1500, fill: 'forwards', easing: 'ease-in-out' }).finished.then(() => set('7 図のアニメーション', 'OK', 'SVG が動いた（見えたかは目視で）'));
});
document.querySelectorAll('[data-heard]').forEach(b => b.onclick = () => {
  const v = b.dataset.heard;
  if (v === 'yes' || v === 'no') set('人の確認: 埋め込み音声', v === 'yes' ? 'OK' : 'NG', '');
  if (v.startsWith('speech')) set('人の確認: 読み上げ', v.endsWith('yes') ? 'OK' : 'NG', '');
  if (v.startsWith('dl')) set('人の確認: ダウンロード', v.endsWith('yes') ? 'OK' : 'NG', '');
});
document.getElementById('b-copy').onclick = () => {
  const t = document.getElementById('out');
  t.select();
  (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject(new Error('clipboard なし')))
    .then(() => set('コピー', 'OK', 'クリップボードへ'))
    .catch(() => { try { document.execCommand('copy'); set('コピー', 'OK', 'execCommand'); } catch (e) { set('コピー', 'NG', '手で選択してコピーしてください'); } });
};
</script>
<!-- __PAD__ -->
</body>
</html>
